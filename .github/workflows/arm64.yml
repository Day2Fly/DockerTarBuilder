name: ARM64 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      images:
        description: "请输入 Docker 镜像名称，多个镜像使用英文逗号分隔"
        required: true
        default: "nginx:latest"


env:
  ARCH: arm64


jobs:

# ==========================
# 生成镜像列表
# ==========================
  prepare:
    name: Prepare Image List
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.list.outputs.matrix }}

    steps:

      - name: Prepare Image List
        id: list
        shell: bash
        run: |

          IMAGE_LIST="${{ github.event.inputs.images }}"

          MATRIX=$(echo "$IMAGE_LIST" \
          | tr ',' '\n' \
          | jq -R -s -c 'split("\n")[:-1]')

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT



# ==========================
# Matrix 并行 Pull
# ==========================
  pull:
    name: Pull ARM64 Images
    needs: prepare

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        image: ${{ fromJson(needs.prepare.outputs.matrix) }}


    steps:


      - name: Install tools
        run: |

          sudo apt update

          sudo apt install -y zstd jq



      - name: Docker Login
        if: secrets.DOCKER_USERNAME != ''
        run: |

          echo "${{ secrets.DOCKER_PASSWORD }}" \
          | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin



      - name: Pull ${{ matrix.image }}
        id: pull
        shell: bash

        run: |

          IMAGE="${{ matrix.image }}"

          mkdir -p output


          SUCCESS=0


          for i in {1..5}
          do

            echo "Pull attempt $i"

            if docker pull --platform linux/arm64 "$IMAGE"
            then

              SUCCESS=1
              break

            fi


            ERROR=$(docker pull --platform linux/arm64 "$IMAGE" 2>&1 || true)


            if echo "$ERROR" | grep -Eq \
            "manifest unknown|no matching manifest|access denied"
            then

              echo "Permanent failure"

              break

            fi


            sleep 15

          done



          SAFE_NAME=$(echo "$IMAGE" \
          | sed 's#[/:]#_#g')


          if [ "$SUCCESS" = "1" ]
          then

            docker save "$IMAGE" \
            -o "output/${SAFE_NAME}.tar"

            echo "$IMAGE" > "output/${SAFE_NAME}.success"


          else

            echo "$IMAGE" > "output/${SAFE_NAME}.failed"

          fi



      - name: Upload Pull Result
        uses: actions/upload-artifact@v4

        with:

          name: pull-result-${{ strategy.job-index }}

          path: output/

          retention-days: 1




# ==========================
# Package
# ==========================
  package:

    name: Package ARM64 Images

    needs: pull

    runs-on: ubuntu-latest



    steps:


      - name: Install zstd

        run: |

          sudo apt update

          sudo apt install -y zstd



      - name: Download Pull Results

        uses: actions/download-artifact@v4

        with:

          pattern: pull-result-*
          merge-multiple: true
          path: results



      - name: Package Images

        shell: bash

        run: |

          mkdir -p package

          cd results



          SUCCESS_FILE="../package/success.txt"
          FAILED_FILE="../package/failed.txt"



          touch "$SUCCESS_FILE"
          touch "$FAILED_FILE"



          TAR_FILES=""


          for f in *.tar
          do

            if [ -f "$f" ]
            then

              TAR_FILES="$TAR_FILES $f"

              echo "$f" >> "$SUCCESS_FILE"

            fi

          done



          for f in *.failed
          do

            if [ -f "$f" ]
            then

              cat "$f" >> "$FAILED_FILE"

            fi

          done



          if [ -n "$TAR_FILES" ]

          then

            tar \
            -cf ../package/docker-images-arm64.tar \
            $TAR_FILES


            zstd \
            -T0 \
            -19 \
            ../package/docker-images-arm64.tar \
            -o ../package/docker-images-arm64.tar.zst



            rm ../package/docker-images-arm64.tar


          else

            echo "No successful images"

          fi



      - name: Upload Final Package

        uses: actions/upload-artifact@v4


        with:

          name: docker-images-arm64

          path: package/

          compression-level: 0

          retention-days: 30
