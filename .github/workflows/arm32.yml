name: ARM32 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请输入 Docker 镜像名称，多个镜像使用英文逗号分隔'
        required: true
        default: 'alpine:latest,ubuntu:latest'
        type: string

permissions:
  contents: read

jobs:

  prepare:
    name: Prepare Image List
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}

    steps:
      - name: Prepare Matrix
        id: prepare
        shell: bash
        env:
          DOCKER_IMAGES: ${{ inputs.docker_images }}
        run: |
          set -euo pipefail

          images_json=$(
            printf '%s\n' "$DOCKER_IMAGES" |
            tr ',' '\n' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
            awk 'NF' |
            jq -R -s 'split("\n") | map(select(length > 0))'
          )

          image_count=$(echo "$images_json" | jq 'length')

          if [ "$image_count" -eq 0 ]; then
            echo "❌ 没有有效的 Docker 镜像。"
            exit 1
          fi

          matrix_json=$(
            echo "$images_json" |
            jq -c '
              to_entries |
              map({
                index: .key,
                image: .value
              })
            '
          )

          echo "$matrix_json" | jq .

          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"


  pull:
    name: "Pull ${{ matrix.image }}"

    needs: prepare

    strategy:
      fail-fast: false
      max-parallel: 4

      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-22.04

    timeout-minutes: 60

    steps:

      - name: Free Disk Space
        shell: bash
        run: |
          set -e

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true

          docker system prune -af || true

          df -h


      - name: Docker Login
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then

            echo "$DOCKER_PASSWORD" |
              docker login \
                --username "$DOCKER_USERNAME" \
                --password-stdin

          else

            echo "未配置 Docker Hub 登录凭据，跳过登录"

          fi


      - name: Pull and Save Image
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          INDEX: ${{ matrix.index }}
        run: |
          set -u

          PLATFORM="linux/arm/v7"

          mkdir -p output
          mkdir -p result

          SAFE_NAME="$(echo "$IMAGE" | sed 's#[/:@]#_#g')"

          TAR_FILE="output/${INDEX}-${SAFE_NAME}-arm32.tar"

          RESULT_FILE="result/result.txt"

          LOG_FILE="result/pull.log"

          pull_success=false
          final_reason=""

          echo "=================================================="
          echo "镜像：$IMAGE"
          echo "平台：$PLATFORM"
          echo "=================================================="


          for retry in 1 2 3 4 5; do

            echo
            echo "第 ${retry}/5 次拉取：$IMAGE"

            : > "$LOG_FILE"

            set +e

            docker pull \
              --platform "$PLATFORM" \
              "$IMAGE" \
              2>&1 |
              tee "$LOG_FILE"

            pull_status=${PIPESTATUS[0]}

            set -e


            if [ "$pull_status" -eq 0 ]; then

              echo "✅ 拉取成功"

              pull_success=true
              break

            fi


            echo "❌ Pull 失败，退出码：$pull_status"


            if grep -Eqi \
              'manifest unknown|manifest.*unknown|no matching manifest|does not have a matching manifest|pull access denied|access denied|unauthorized|authentication required|insufficient_scope|repository does not exist|repository.*not found|not found: manifest|invalid reference format|reference does not match' \
              "$LOG_FILE"; then

              final_reason="不可重试：镜像/Tag/ARM32架构不存在或无权限"

              echo "⚠️ $final_reason"

              break

            fi


            if grep -Eqi \
              '429|too many requests|timeout|timed out|TLS handshake timeout|connection reset|connection refused|connection timed out|unexpected EOF|EOF|temporary failure|temporary error|network is unreachable|no route to host|502|503|504|bad gateway|service unavailable|server error|i/o timeout|context deadline exceeded|rate limit' \
              "$LOG_FILE"; then

              final_reason="网络或临时错误"

              if [ "$retry" -lt 5 ]; then

                echo "🌐 20 秒后重试..."
                sleep 20

              fi

            else

              final_reason="未知错误"

              if [ "$retry" -lt 5 ]; then

                echo "⚠️ 未识别错误，20 秒后重试..."
                sleep 20

              fi

            fi

          done


          if [ "$pull_success" != true ]; then

            {
              echo "STATUS=failed"
              echo "IMAGE=$IMAGE"
              echo "PLATFORM=$PLATFORM"
              echo "REASON=$final_reason"
            } > "$RESULT_FILE"

            exit 0

          fi


          echo
          echo "开始 docker save..."

          if docker save \
            "$IMAGE" \
            -o "$TAR_FILE"; then

            {
              echo "STATUS=success"
              echo "IMAGE=$IMAGE"
              echo "PLATFORM=$PLATFORM"
              echo "FILE=$(basename "$TAR_FILE")"
            } > "$RESULT_FILE"

          else

            rm -f "$TAR_FILE"

            {
              echo "STATUS=failed"
              echo "IMAGE=$IMAGE"
              echo "PLATFORM=$PLATFORM"
              echo "REASON=docker save failed"
            } > "$RESULT_FILE"

          fi


      - name: Upload Docker TAR
        if: hashFiles('output/*.tar') != ''
        uses: actions/upload-artifact@v7
        with:
          path: output/*.tar
          archive: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 7


      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.index }}
          path: result/result.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 7


      - name: Clean Workspace
        if: always()
        run: |
          rm -rf output
          rm -rf result
          docker system prune -af || true


  package:
    name: Package ARM32 Images

    needs:
      - prepare
      - pull

    if: always() && needs.prepare.result == 'success'

    runs-on: ubuntu-22.04

    timeout-minutes: 30

    steps:

      - name: Install zstd
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd


      - name: Download Docker TAR Files
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: '*-arm32.tar'
          path: success-images
          merge-multiple: true


      - name: Download Result Files
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: result-*
          path: results
          merge-multiple: true


      - name: Package Images
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          SUCCESS_FILE="output/success.txt"
          FAILED_FILE="output/failed.txt"

          : > "$SUCCESS_FILE"
          : > "$FAILED_FILE"

          success_count=0
          failed_count=0

          shopt -s nullglob

          result_files=(results/*.txt)

          for file in "${result_files[@]}"; do

            status="$(grep '^STATUS=' "$file" | cut -d= -f2- || true)"
            image="$(grep '^IMAGE=' "$file" | cut -d= -f2- || true)"
            platform="$(grep '^PLATFORM=' "$file" | cut -d= -f2- || true)"
            reason="$(grep '^REASON=' "$file" | cut -d= -f2- || true)"

            if [ "$status" = "success" ]; then

              echo "$image | $platform | success" \
                >> "$SUCCESS_FILE"

              success_count=$((success_count + 1))

            else

              echo "$image | $platform | $reason" \
                >> "$FAILED_FILE"

              failed_count=$((failed_count + 1))

            fi

          done


          tar_files=(success-images/*-arm32.tar)


          if [ "${#tar_files[@]}" -eq 0 ]; then

            echo "没有成功的 Docker 镜像。" \
              > output/package_status.txt

          else

            tar -cf \
              output/arm32-images.tar \
              -C success-images \
              "${tar_files[@]#success-images/}"


            zstd \
              -T0 \
              -3 \
              --rm \
              output/arm32-images.tar \
              -o output/arm32-images.tar.zst


            sha256sum \
              output/arm32-images.tar.zst \
              > output/arm32-images.sha256


            echo "ARM32 Docker 镜像打包成功。" \
              > output/package_status.txt

          fi


          echo
          echo "========================================"
          echo "ARM32 最终统计"
          echo "========================================"

          echo "成功镜像：$success_count"
          echo "失败镜像：$failed_count"

          echo
          echo "========== SUCCESS =========="
          cat "$SUCCESS_FILE" || true

          echo
          echo "========== FAILED =========="
          cat "$FAILED_FILE" || true

          echo
          echo "========== FINAL FILES =========="

          find output \
            -maxdepth 1 \
            -type f \
            -printf '%f  %s bytes\n' \
            | sort


      - name: Upload Final Artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-images-arm32
          path: |
            output/arm32-images.tar.zst
            output/arm32-images.sha256
            output/success.txt
            output/failed.txt
            output/package_status.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn


      - name: Clean Package Workspace
        if: always()
        run: |
          rm -rf success-images
          rm -rf results
          rm -rf output
