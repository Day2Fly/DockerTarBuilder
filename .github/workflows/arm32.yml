name: ARM32 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      images:
        description: "请输入 Docker 镜像名称，多个镜像使用英文逗号分隔"
        required: true
        default: "alpine:latest,ubuntu:latest"
        type: string

permissions:
  contents: read
  actions: write

jobs:

  # ==========================================================
  # 1. Prepare
  # ==========================================================
  prepare:
    name: Prepare Image List
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}

    steps:
      - name: Prepare Image List
        id: prepare
        shell: bash
        env:
          IMAGE_LIST: ${{ inputs.images }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "原始输入"
          echo "========================================"
          printf '%s\n' "$IMAGE_LIST"

          # --------------------------------------------------
          # 规范化输入
          #
          # 支持：
          # image1,image2
          # image1, image2
          # "image1","image2"
          # image1，image2
          #
          # 同时：
          # - 删除空行
          # - 删除重复镜像
          # - 去掉首尾空格
          # --------------------------------------------------
          CLEANED_LIST="$(
            printf '%s\n' "$IMAGE_LIST" |
            tr '，' ',' |
            sed 's/"//g' |
            tr ',' '\n' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
            awk 'NF' |
            awk '!seen[$0]++'
          )"

          if [ -z "$CLEANED_LIST" ]; then
            echo "❌ 没有检测到有效的 Docker 镜像。"
            exit 1
          fi

          echo
          echo "========================================"
          echo "清理后的镜像列表"
          echo "========================================"

          printf '%s\n' "$CLEANED_LIST"

          # --------------------------------------------------
          # 生成 Matrix JSON
          #
          # 例如：
          # [
          #   {
          #     "index": 0,
          #     "image": "image1"
          #   },
          #   {
          #     "index": 1,
          #     "image": "image2"
          #   }
          # ]
          #
          # 这里过滤空项，避免产生额外的：
          # Pull
          # 空 Matrix Job
          # --------------------------------------------------
          MATRIX="$(
            printf '%s\n' "$CLEANED_LIST" |
            jq -R -s -c '
              split("\n")
              | map(select(length > 0))
              | to_entries
              | map({
                  index: .key,
                  image: .value
                })
            '
          )"

          IMAGE_COUNT="$(printf '%s' "$MATRIX" | jq 'length')"

          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "❌ Matrix 中没有有效镜像。"
            exit 1
          fi

          echo
          echo "========================================"
          echo "Matrix 镜像数量：$IMAGE_COUNT"
          echo "========================================"

          printf '%s\n' "$MATRIX" | jq .

          # --------------------------------------------------
          # 单行写入 GITHUB_OUTPUT
          # 避免 Invalid format
          # --------------------------------------------------
          printf 'matrix=%s\n' "$MATRIX" >> "$GITHUB_OUTPUT"

          echo
          echo "✅ Prepare 完成"


  # ==========================================================
  # 2. Matrix 并行 Pull / Save / Compress
  # ==========================================================
  pull:
    name: "Pull ${{ matrix.image }}"

    needs: prepare

    strategy:
      fail-fast: false
      max-parallel: 4

      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ------------------------------------------------------
      # 清理 Runner
      # ------------------------------------------------------
      - name: Free Disk Space
        shell: bash
        run: |
          set -e

          echo "清理 Runner 磁盘空间..."

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true

          docker system prune -af || true

          echo
          echo "当前磁盘："
          df -h


      # ------------------------------------------------------
      # 安装工具
      # ------------------------------------------------------
      - name: Install Tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y zstd jq

          echo
          zstd --version
          jq --version


      # ------------------------------------------------------
      # Docker Hub Login
      #
      # 注意：
      # secrets 不直接放在 if 中
      # ------------------------------------------------------
      - name: Docker Login
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then

            echo "检测到 Docker Hub 登录凭据，开始登录..."

            echo "$DOCKER_PASSWORD" |
              docker login \
                --username "$DOCKER_USERNAME" \
                --password-stdin

          else

            echo "未配置 Docker Hub 登录凭据，跳过登录。"

          fi


      # ------------------------------------------------------
      # Pull → Save → Zstd
      # ------------------------------------------------------
      - name: Pull Save and Compress
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          INDEX: ${{ matrix.index }}
        run: |
          set -u

          PLATFORM="linux/arm/v7"

          mkdir -p bundle
          mkdir -p logs

          SAFE_NAME="$(
            printf '%s' "$IMAGE" |
            sed 's#[/:@]#_#g'
          )"

          TAR_FILE="bundle/${SAFE_NAME}-arm32.tar"
          ZST_FILE="bundle/${SAFE_NAME}-arm32.tar.zst"

          RESULT_FILE="bundle/result.txt"
          LOG_FILE="logs/pull.log"

          PULL_SUCCESS=false
          FINAL_REASON=""

          echo "=================================================="
          echo "镜像：$IMAGE"
          echo "平台：$PLATFORM"
          echo "Matrix Index：$INDEX"
          echo "=================================================="


          # ==================================================
          # Docker Pull
          # ==================================================

          for retry in 1 2 3 4 5; do

            echo
            echo "========================================"
            echo "Pull 尝试 ${retry}/5"
            echo "========================================"

            : > "$LOG_FILE"

            set +e

            docker pull \
              --platform "$PLATFORM" \
              "$IMAGE" \
              2>&1 |
              tee "$LOG_FILE"

            PULL_STATUS=${PIPESTATUS[0]}

            set -e

            if [ "$PULL_STATUS" -eq 0 ]; then

              echo
              echo "✅ Docker Pull 成功"

              PULL_SUCCESS=true
              break

            fi

            echo
            echo "❌ Docker Pull 失败，退出码：$PULL_STATUS"


            # ------------------------------------------------
            # 确定性错误
            # 不重试
            # ------------------------------------------------
            if grep -Eqi \
              'manifest unknown|manifest.*unknown|no matching manifest|does not have a matching manifest|pull access denied|access denied|unauthorized|authentication required|insufficient_scope|repository does not exist|repository.*not found|not found: manifest|invalid reference format|reference does not match' \
              "$LOG_FILE"; then

              FINAL_REASON="不可重试：镜像/Tag/ARM32架构不存在或无权限"

              echo "⚠️ $FINAL_REASON"

              break

            fi


            # ------------------------------------------------
            # 网络 / 临时错误
            # ------------------------------------------------
            if grep -Eqi \
              '429|too many requests|timeout|timed out|TLS handshake timeout|connection reset|connection refused|connection timed out|unexpected EOF|EOF|temporary failure|temporary error|network is unreachable|no route to host|502|503|504|bad gateway|service unavailable|server error|i/o timeout|context deadline exceeded|rate limit' \
              "$LOG_FILE"; then

              FINAL_REASON="网络或临时错误"

              if [ "$retry" -lt 5 ]; then

                echo
                echo "🌐 检测到网络/临时错误"
                echo "20 秒后重试..."

                sleep 20

              else

                echo
                echo "❌ 网络错误已连续失败 5 次"

              fi

            else

              FINAL_REASON="未知错误"

              if [ "$retry" -lt 5 ]; then

                echo
                echo "⚠️ 未识别错误"
                echo "20 秒后重试..."

                sleep 20

              else

                echo
                echo "❌ 未知错误连续失败 5 次"

              fi

            fi

          done


          # ==================================================
          # Pull 失败
          # ==================================================

          if [ "$PULL_SUCCESS" != true ]; then

            echo
            echo "=================================================="
            echo "❌ 镜像处理失败"
            echo "镜像：$IMAGE"
            echo "原因：$FINAL_REASON"
            echo "=================================================="

            {
              echo "STATUS=failed"
              echo "IMAGE=$IMAGE"
              echo "PLATFORM=$PLATFORM"
              echo "REASON=$FINAL_REASON"
            } > "$RESULT_FILE"

            rm -f "$TAR_FILE" "$ZST_FILE"

            # 当前 Matrix 正常结束
            # 其它 Matrix Job 不受影响
            exit 0

          fi


          # ==================================================
          # Docker Save
          # ==================================================

          echo
          echo "========================================"
          echo "开始 Docker Save"
          echo "========================================"

          if ! docker save \
            "$IMAGE" \
            -o "$TAR_FILE"; then

            echo "❌ Docker Save 失败"

            rm -f "$TAR_FILE" "$ZST_FILE"

            {
              echo "STATUS=failed"
              echo "IMAGE=$IMAGE"
              echo "PLATFORM=$PLATFORM"
              echo "REASON=docker save failed"
            } > "$RESULT_FILE"

            exit 0

          fi


          # ==================================================
          # TAR 大小检查
          # ==================================================

          TAR_SIZE="$(stat -c '%s' "$TAR_FILE")"

          echo
          echo "TAR 大小：${TAR_SIZE} bytes"

          if [ "$TAR_SIZE" -lt 1024 ]; then

            echo "❌ TAR 小于 1 KiB，判定为异常文件"

            rm -f "$TAR_FILE"

            {
              echo "STATUS=failed"
              echo "IMAGE=$IMAGE"
              echo "PLATFORM=$PLATFORM"
              echo "REASON=invalid or empty docker tar"
            } > "$RESULT_FILE"

            exit 0

          fi


          # ==================================================
          # TAR 完整性检查
          # ==================================================

          if ! tar -tf "$TAR_FILE" >/dev/null 2>&1; then

            echo "❌ TAR 文件无法正常读取"

            rm -f "$TAR_FILE"

            {
              echo "STATUS=failed"
              echo "IMAGE=$IMAGE"
              echo "PLATFORM=$PLATFORM"
              echo "REASON=corrupted docker tar"
            } > "$RESULT_FILE"

            exit 0

          fi

          echo "✅ TAR 校验通过"


          # ==================================================
          # Zstandard
          # ==================================================

          echo
          echo "========================================"
          echo "开始 Zstandard 压缩"
          echo "========================================"

          if ! zstd \
            -T0 \
            -3 \
            --rm \
            "$TAR_FILE" \
            -o "$ZST_FILE"; then

            echo "❌ Zstandard 压缩失败"

            rm -f "$TAR_FILE" "$ZST_FILE"

            {
              echo "STATUS=failed"
              echo "IMAGE=$IMAGE"
              echo "PLATFORM=$PLATFORM"
              echo "REASON=zstd compression failed"
            } > "$RESULT_FILE"

            exit 0

          fi


          ZST_SIZE="$(stat -c '%s' "$ZST_FILE")"

          echo
          echo "ZST 大小：${ZST_SIZE} bytes"

          if [ "$ZST_SIZE" -lt 1024 ]; then

            echo "❌ ZST 小于 1 KiB，判定为异常文件"

            rm -f "$ZST_FILE"

            {
              echo "STATUS=failed"
              echo "IMAGE=$IMAGE"
              echo "PLATFORM=$PLATFORM"
              echo "REASON=invalid compressed file"
            } > "$RESULT_FILE"

            exit 0

          fi


          # ==================================================
          # ZST 完整性检查
          # ==================================================

          if ! zstd -t "$ZST_FILE" >/dev/null 2>&1; then

            echo "❌ ZST 完整性检查失败"

            rm -f "$ZST_FILE"

            {
              echo "STATUS=failed"
              echo "IMAGE=$IMAGE"
              echo "PLATFORM=$PLATFORM"
              echo "REASON=corrupted compressed file"
            } > "$RESULT_FILE"

            exit 0

          fi

          echo "✅ ZST 校验通过"


          # ==================================================
          # 成功结果
          # ==================================================

          {
            echo "STATUS=success"
            echo "IMAGE=$IMAGE"
            echo "PLATFORM=$PLATFORM"
            echo "FILE=$(basename "$ZST_FILE")"
            echo "SIZE=$ZST_SIZE"
          } > "$RESULT_FILE"


          echo
          echo "=================================================="
          echo "✅ Matrix 镜像处理完成"
          echo "=================================================="

          ls -lh bundle

          echo
          cat "$RESULT_FILE"


      # ======================================================
      # 3. Matrix 临时 Artifact
      #
      # 每个 Matrix Job 只上传自己的：
      #   *.tar.zst
      #   result.txt
      #
      # Package 后面通过 REST API 下载。
      # ======================================================
      - name: Upload Matrix Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-arm32-${{ matrix.index }}
          path: bundle/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error


      # ======================================================
      # 4. 清理 Matrix Runner
      # ======================================================
      - name: Clean Matrix Workspace
        if: always()
        shell: bash
        run: |
          rm -rf bundle
          rm -rf logs

          docker system prune -af || true


  # ==========================================================
  # 5. Package
  # ==========================================================
  package:
    name: Package ARM32 Images

    needs:
      - prepare
      - pull

    # 部分 Matrix 失败也必须进入 Package
    if: always() && needs.prepare.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:


      # ------------------------------------------------------
      # 安装工具
      # ------------------------------------------------------
      - name: Install Tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y zstd jq unzip

          zstd --version
          jq --version


      # ------------------------------------------------------
      # 准备目录
      # ------------------------------------------------------
      - name: Prepare Package Workspace
        shell: bash
        run: |
          set -e

          mkdir -p temp-artifacts
          mkdir -p extracted
          mkdir -p raw-images
          mkdir -p output


      # ======================================================
      # 6. 通过 GitHub REST API 下载当前 Run 的 Matrix Artifact
      # ======================================================
      - name: Download Matrix Artifacts via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts"


          echo "========================================"
          echo "读取当前 Workflow Run Artifacts"
          echo "Run ID: ${RUN_ID}"
          echo "========================================"


          response="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "${API}?per_page=100"
          )"


          echo
          echo "当前 Artifacts："


          echo "$response" |
            jq -r '
              .artifacts[] |
              "\(.id)\t\(.name)\t\(.size_in_bytes) bytes\texpired=\(.expired)"
            ' || true


          # --------------------------------------------------
          # 只处理 Matrix Artifact
          # --------------------------------------------------
          artifact_count="$(
            echo "$response" |
            jq '
              [
                .artifacts[]
                | select(
                    (.name | startswith("matrix-arm32-"))
                    and (.expired == false)
                  )
              ]
              | length
            '
          )"


          echo
          echo "Matrix Artifact 数量：${artifact_count}"


          if [ "$artifact_count" -eq 0 ]; then

            echo "⚠️ 没有找到 Matrix Artifact"

            exit 0

          fi


          # --------------------------------------------------
          # 下载每个 Matrix Artifact
          # --------------------------------------------------
          echo "$response" |
            jq -r '
              .artifacts[]
              | select(
                  (.name | startswith("matrix-arm32-"))
                  and (.expired == false)
                )
              | [
                  .id,
                  .name,
                  .archive_download_url
                ]
              | @tsv
            ' |
          while IFS=$'\t' read -r artifact_id artifact_name download_url; do

            [ -n "$artifact_id" ] || continue


            echo
            echo "========================================"
            echo "下载 Matrix Artifact"
            echo "ID   : ${artifact_id}"
            echo "Name : ${artifact_name}"
            echo "========================================"


            zip_file="temp-artifacts/${artifact_name}.zip"
            extract_dir="extracted/${artifact_name}"


            mkdir -p "$extract_dir"


            # GitHub API 会返回 302
            # curl -L 跟随跳转
            curl -fL \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$download_url" \
              -o "$zip_file"


            echo "✅ Artifact 下载完成"


            unzip -q \
              "$zip_file" \
              -d "$extract_dir"


            echo "✅ Artifact 解压完成"


            rm -f "$zip_file"

          done


      # ======================================================
      # 7. 汇总成功 / 失败结果
      # ======================================================
      - name: Collect Results
        shell: bash
        run: |
          set -euo pipefail

          SUCCESS_FILE="output/success.txt"
          FAILED_FILE="output/failed.txt"

          : > "$SUCCESS_FILE"
          : > "$FAILED_FILE"

          success_count=0
          failed_count=0


          echo "========================================"
          echo "读取 Matrix 处理结果"
          echo "========================================"


          shopt -s nullglob

          result_files=(extracted/*/result.txt)


          if [ "${#result_files[@]}" -eq 0 ]; then

            echo "⚠️ 没有找到 Matrix 结果文件。"

          else

            for file in "${result_files[@]}"; do

              echo
              echo "----------------------------------------"
              echo "结果文件：$file"
              echo "----------------------------------------"


              cat "$file"


              STATUS="$(grep '^STATUS=' "$file" | cut -d= -f2- || true)"
              IMAGE="$(grep '^IMAGE=' "$file" | cut -d= -f2- || true)"
              PLATFORM="$(grep '^PLATFORM=' "$file" | cut -d= -f2- || true)"
              REASON="$(grep '^REASON=' "$file" | cut -d= -f2- || true)"


              if [ "$STATUS" = "success" ]; then

                echo "$IMAGE | $PLATFORM | success" \
                  >> "$SUCCESS_FILE"

                success_count=$((success_count + 1))

              else

                echo "$IMAGE | $PLATFORM | $REASON" \
                  >> "$FAILED_FILE"

                failed_count=$((failed_count + 1))

              fi

            done

          fi


          echo
          echo "========================================"
          echo "Matrix 统计"
          echo "========================================"

          echo "成功：$success_count"
          echo "失败：$failed_count"


      # ======================================================
      # 8. 解压并校验 Matrix ZST
      # ======================================================
      - name: Extract and Validate Images
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          zst_files=(extracted/*/*.tar.zst)

          valid_count=0
          invalid_count=0


          echo "========================================"
          echo "检查 Matrix ZST"
          echo "========================================"


          for zst_file in "${zst_files[@]}"; do

            echo
            echo "检查：$zst_file"


            zst_size="$(stat -c '%s' "$zst_file")"


            if [ "$zst_size" -lt 1024 ]; then

              echo "⚠️ ZST 太小，删除：$zst_file"

              rm -f "$zst_file"

              invalid_count=$((invalid_count + 1))

              continue

            fi


            # ------------------------------------------------
            # ZST 完整性
            # ------------------------------------------------
            if ! zstd -t "$zst_file" >/dev/null 2>&1; then

              echo "❌ ZST 已损坏，删除：$zst_file"

              rm -f "$zst_file"

              invalid_count=$((invalid_count + 1))

              continue

            fi


            # ------------------------------------------------
            # 解压
            # ------------------------------------------------
            base="$(basename "$zst_file" .zst)"

            output_tar="raw-images/$base"


            if ! zstd \
              -T0 \
              -d \
              "$zst_file" \
              -o "$output_tar"; then

              echo "❌ ZST 解压失败，删除：$zst_file"

              rm -f "$zst_file"
              rm -f "$output_tar"

              invalid_count=$((invalid_count + 1))

              continue

            fi


            # ------------------------------------------------
            # TAR 大小
            # ------------------------------------------------
            tar_size="$(stat -c '%s' "$output_tar")"


            if [ "$tar_size" -lt 1024 ]; then

              echo "❌ TAR 太小，删除：$output_tar"

              rm -f "$output_tar"

              invalid_count=$((invalid_count + 1))

              continue

            fi


            # ------------------------------------------------
            # TAR 完整性
            # ------------------------------------------------
            if ! tar -tf "$output_tar" >/dev/null 2>&1; then

              echo "❌ TAR 损坏，删除：$output_tar"

              rm -f "$output_tar"

              invalid_count=$((invalid_count + 1))

              continue

            fi


            echo "✅ TAR 有效"

            valid_count=$((valid_count + 1))


            # 成功解压后，不再保留 Matrix ZST
            rm -f "$zst_file"

          done


          echo
          echo "========================================"
          echo "有效 TAR：$valid_count"
          echo "异常 TAR：$invalid_count"
          echo "========================================"


      # ======================================================
      # 9. 创建最终 ARM32 包
      # ======================================================
      - name: Build Final ARM32 Package
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          tar_files=(raw-images/*.tar)


          if [ "${#tar_files[@]}" -eq 0 ]; then

            echo "⚠️ 没有任何有效 Docker TAR"

            echo "没有成功的 Docker 镜像。" \
              > output/package_status.txt

          else

            echo
            echo "========================================"
            echo "准备合并 ${#tar_files[@]} 个 Docker TAR"
            echo "========================================"

            printf '%s\n' "${tar_files[@]}"


            # ------------------------------------------------
            # 合并所有成功镜像
            # ------------------------------------------------
            tar \
              -cf \
              output/docker-images-arm32.tar \
              -C raw-images \
              "${tar_files[@]#raw-images/}"


            final_tar_size="$(
              stat -c '%s' output/docker-images-arm32.tar
            )"


            echo
            echo "最终 TAR 大小：${final_tar_size} bytes"


            if [ "$final_tar_size" -lt 1024 ]; then

              echo "❌ 最终 TAR 异常"

              rm -f output/docker-images-arm32.tar

              exit 1

            fi


            # ------------------------------------------------
            # 最终 Zstandard
            # ------------------------------------------------
            echo
            echo "开始最终 Zstandard 压缩..."


            zstd \
              -T0 \
              -3 \
              --rm \
              output/docker-images-arm32.tar \
              -o output/docker-images-arm32.tar.zst


            # ------------------------------------------------
            # SHA256
            # ------------------------------------------------
            sha256sum \
              output/docker-images-arm32.tar.zst \
              > output/docker-images-arm32.sha256


            echo "ARM32 Docker 镜像打包成功。" \
              > output/package_status.txt

          fi


          echo
          echo "========================================"
          echo "ARM32 最终文件"
          echo "========================================"


          find output \
            -maxdepth 1 \
            -type f \
            -printf '%f  %s bytes\n' \
            | sort


          echo
          echo "========== SUCCESS =========="

          cat output/success.txt || true


          echo
          echo "========== FAILED =========="

          cat output/failed.txt || true


          echo
          echo "========================================"
          echo "Package 完成"
          echo "========================================"


      # ======================================================
      # 10. 最终唯一 Artifact
      # ======================================================
      - name: Upload Final ARM32 Package
        uses: actions/upload-artifact@v7
        with:
          name: docker-images-arm32

          path: |
            output/docker-images-arm32.tar.zst
            output/docker-images-arm32.sha256
            output/success.txt
            output/failed.txt
            output/package_status.txt

          compression-level: 0
          retention-days: 7
          if-no-files-found: warn


      # ======================================================
      # 11. 删除本次运行的 Matrix 临时 Artifact
      # ======================================================
      - name: Delete Temporary Matrix Artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e

          API="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts"


          echo "========================================"
          echo "清理 ARM32 Matrix 临时 Artifact"
          echo "========================================"


          response="$(
            curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "${API}?per_page=100"
          )"


          echo "$response" |
            jq -r '
              .artifacts[]
              | select(
                  (.name | startswith("matrix-arm32-"))
                )
              | .id
            ' |
          while read -r artifact_id; do

            if [ -z "$artifact_id" ]; then
              continue
            fi


            echo "删除临时 Artifact：$artifact_id"


            HTTP_CODE="$(
              curl -sS \
                -o /dev/null \
                -w "%{http_code}" \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${REPO}/actions/artifacts/${artifact_id}"
            )"


            if [ "$HTTP_CODE" = "204" ]; then

              echo "✅ 删除成功：$artifact_id"

            else

              echo "⚠️ 删除失败：$artifact_id HTTP ${HTTP_CODE}"

            fi

          done


          echo
          echo "========================================"
          echo "ARM32 Matrix 临时 Artifact 清理结束"
          echo "========================================"


      # ======================================================
      # 12. 清理 Package Runner
      # ======================================================
      - name: Clean Package Workspace
        if: always()
        shell: bash
        run: |
          rm -rf temp-artifacts
          rm -rf extracted
          rm -rf raw-images
          rm -rf output
