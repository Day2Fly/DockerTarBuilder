name: AMD64 Pull and Save Docker Image


on:
  workflow_dispatch:
    inputs:
      images:
        description: "请输入 Docker 镜像名称，多个镜像使用英文逗号分隔"
        required: true
        type: string


permissions:
  contents: read
  actions: write



jobs:


# ==================================================
# Prepare Matrix List
# ==================================================

  prepare:

    name: Prepare Image List

    runs-on: ubuntu-latest


    outputs:

      images: ${{ steps.prepare.outputs.images }}



    steps:


      - name: Generate Matrix

        id: prepare

        shell: bash

        run: |


          IMAGE_LIST="${{ inputs.images }}"


          JSON=$(echo "$IMAGE_LIST" \
          | tr ',' '\n' \
          | sed '/^[[:space:]]*$/d' \
          | jq -R . \
          | jq -c .)


          echo "images=$JSON" >> "$GITHUB_OUTPUT"




# ==================================================
# Matrix Pull
# ==================================================

  pull:


    name: Pull ${{ matrix.image }}


    needs: prepare


    runs-on: ubuntu-latest


    strategy:

      fail-fast: false

      matrix:

        image: ${{ fromJson(needs.prepare.outputs.images) }}



    steps:



      - name: Free Disk Space


        run:


          sudo rm -rf \
          /usr/local/lib/android \
          /usr/share/dotnet \
          /opt/ghc




      - name: Prepare Directory


        run:


          mkdir -p output




      - name: Pull Docker Image


        id: docker_pull


        shell: bash


        continue-on-error: true


        run: |


          IMAGE="${{ matrix.image }}"


          echo "Pulling $IMAGE"


          ERROR_LOG="pull-error.log"



          for retry in {1..5}

          do


            echo "Attempt $retry / 5"



            if docker pull "$IMAGE" 2>"$ERROR_LOG"

            then

              echo "success=true" >> $GITHUB_OUTPUT

              exit 0


            fi



            ERROR=$(cat "$ERROR_LOG")


            echo "$ERROR"



            if echo "$ERROR" | grep -Eiq \
            "manifest unknown|no matching manifest|access denied|pull access denied"

            then

              echo "Permanent failure"

              break

            fi



            sleep 15



          done



          echo "success=false" >> $GITHUB_OUTPUT



      - name: Save Docker TAR


        if: steps.docker_pull.outputs.success == 'true'


        shell: bash


        run: |


          IMAGE="${{ matrix.image }}"


          SAFE_NAME=$(echo "$IMAGE" \
          | sed 's#[/:]#_#g')



          docker save "$IMAGE" \
          -o "output/${SAFE_NAME}.tar"



          SIZE=$(stat -c%s "output/${SAFE_NAME}.tar")



          if [ "$SIZE" -lt 1024 ]

          then

              echo "Invalid TAR"

              rm -f "output/${SAFE_NAME}.tar"

          fi




      - name: Record Failed Image


        if: steps.docker_pull.outputs.success != 'true'


        shell: bash


        run: |


          mkdir -p output



          IMAGE="${{ matrix.image }}"



          echo "$IMAGE" >> output/failed.txt




      - name: Upload Matrix Result


        uses: actions/upload-artifact@v4


        with:


          name: matrix-${{ strategy.job-index }}


          path: output




# ==================================================
# Package
# ==================================================

  package:


    name: Package AMD64 Images


    needs: pull


    runs-on: ubuntu-latest




    steps:



      - name: Download Matrix Results


        uses: actions/download-artifact@v4


        with:


          pattern: matrix-*


          merge-multiple: true


          path: input




      - name: Install zstd


        run:


          sudo apt update


          sudo apt install -y zstd




      - name: Package Docker Images


        shell: bash


        run: |



          mkdir -p package



          SUCCESS=0



          FAILED=0




          if ls input/*.tar >/dev/null 2>&1

          then


              for file in input/*.tar

              do


                  SIZE=$(stat -c%s "$file")



                  if [ "$SIZE" -gt 1024 ]

                  then

                      cp "$file" package/

                      SUCCESS=$((SUCCESS+1))

                  else

                      rm -f "$file"

                  fi


              done


          fi




          tar -cf docker-images-amd64.tar \
          -C package .



          zstd -19 \
          docker-images-amd64.tar \
          -o docker-images-amd64.tar.zst




          echo "Docker Image Result" > result-amd64.txt


          echo "" >> result-amd64.txt


          echo "Success Images: $SUCCESS" >> result-amd64.txt



          echo "" >> result-amd64.txt


          echo "Files:" >> result-amd64.txt



          ls package >> result-amd64.txt || true



          if [ -f input/failed.txt ]

          then

              cp input/failed.txt failed-amd64.txt

          else

              echo "No failed images" > failed-amd64.txt

          fi




      - name: Upload Final Package


        uses: actions/upload-artifact@v4


        with:


          name: docker-images-amd64


          path: |


            docker-images-amd64.tar.zst

            result-amd64.txt

            failed-amd64.txt
