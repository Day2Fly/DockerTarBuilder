name: AMD64 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请输入 Docker 镜像名称，多个镜像使用英文逗号分隔'
        required: true
        default: 'alpine:latest,ubuntu:latest'
        type: string

permissions:
  contents: read

concurrency:
  group: docker-amd64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull_and_package:
    name: Pull AMD64 Images
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Install zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "$DOCKER_PASSWORD" | docker login \
              -u "$DOCKER_USERNAME" \
              --password-stdin
          else
            echo "未配置 Docker Hub 登录凭据，跳过登录"
          fi

      - name: Pull Docker Images and Package
        shell: bash
        env:
          DOCKER_IMAGES: ${{ github.event.inputs.docker_images }}
        run: |
          set -euo pipefail

          mkdir -p output

          IFS=',' read -r -a image_array <<< "$DOCKER_IMAGES"

          for image in "${image_array[@]}"; do
            # 去除镜像名称前后的空格
            image="$(echo "$image" | xargs)"

            # 跳过空项目
            if [ -z "$image" ]; then
              continue
            fi

            echo "========================================"
            echo "开始拉取镜像: $image"
            echo "目标架构: linux/amd64"
            echo "========================================"

            success=false

            for retry in 1 2 3 4 5; do
              echo "拉取尝试 ${retry}/5: $image"

              if docker pull --platform linux/amd64 "$image"; then
                success=true
                echo "镜像拉取成功: $image"
                break
              fi

              if [ "$retry" -lt 5 ]; then
                echo "拉取失败，20 秒后重试..."
                sleep 20
              fi
            done

            if [ "$success" != true ]; then
              echo "========================================"
              echo "镜像拉取失败: $image"
              echo "已重试 5 次，终止任务。"
              echo "========================================"
              exit 1
            fi

            # 将 / 和 : 替换成 _
            filename="$(echo "$image" | sed 's#[/:]#_#g')"

            echo "保存 Docker TAR: ${filename}-amd64.tar"

            docker save "$image" \
              -o "output/${filename}-amd64.tar"

            echo "保存完成: ${filename}-amd64.tar"
          done

          echo "========================================"
          echo "所有镜像拉取并保存完成"
          echo "========================================"

          ls -lh output

      - name: Compress Images
        shell: bash
        run: |
          set -euo pipefail

          cd output

          shopt -s nullglob
          tar_files=(*-amd64.tar)

          if [ "${#tar_files[@]}" -eq 0 ]; then
            echo "错误：没有找到 AMD64 TAR 文件"
            exit 1
          fi

          echo "准备打包以下文件："
          printf '%s\n' "${tar_files[@]}"

          tar -cf amd64-images.tar "${tar_files[@]}"

          echo "开始使用 Zstandard 压缩..."

          zstd -19 \
            --rm \
            amd64-images.tar \
            -o amd64-images.tar.zst

          sha256sum amd64-images.tar.zst \
            > amd64-images.sha256

          echo "========================================"
          echo "最终文件："
          ls -lh amd64-images.tar.zst
          ls -lh amd64-images.sha256
          echo "========================================"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-amd64
          path: |
            output/amd64-images.tar.zst
            output/amd64-images.sha256
          retention-days: 7

      - name: Clean Workspace
        if: always()
        run: |
          rm -rf output
          docker system prune -af || true
