name: AMD64 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      images:
        description: "请输入 Docker 镜像名称，多个镜像使用英文逗号分隔"
        required: true
        type: string


permissions:
  contents: read
  actions: write


jobs:

# ==============================
# 生成 Matrix
# ==============================

  prepare:
    name: Prepare Image List
    runs-on: ubuntu-latest

    outputs:
      images: ${{ steps.list.outputs.images }}

    steps:

      - id: list
        shell: bash
        run: |

          IMAGES='${{ inputs.images }}'

          JSON=$(echo "$IMAGES" \
          | tr ',' '\n' \
          | sed '/^$/d' \
          | jq -R . \
          | jq -c -s .)

          echo "images=$JSON" >> $GITHUB_OUTPUT



# ==============================
# 并行拉取
# ==============================

  pull:

    name: Pull ${{ matrix.image }}

    needs: prepare

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      matrix:

        image: ${{ fromJson(needs.prepare.outputs.images) }}


    steps:


      - name: Free Disk Space

        run: |

          sudo rm -rf \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/share/powershell



      - name: Login Docker

        run: |

          docker login



      - name: Pull Docker Image

        id: pull

        continue-on-error: true

        run: |

          IMAGE="${{ matrix.image }}"

          echo "Pull $IMAGE"


          for i in {1..5}
          do

            docker pull "$IMAGE" && break

            echo "retry $i"

            sleep 10

          done



      - name: Save TAR

        if: steps.pull.outcome == 'success'

        run: |

          mkdir -p output


          NAME=$(echo "${{ matrix.image }}" \
          | tr '/:' '_')


          docker save \
          "${{ matrix.image }}" \
          -o "output/${NAME}.tar"



      - name: Upload Matrix TAR

        if: false

        uses: actions/upload-artifact@v4

        with:

          name: hidden

          path: output



# ==============================
# 打包阶段
# ==============================

  package:


    name: Package AMD64 Images


    needs: pull


    runs-on: ubuntu-latest


    steps:


      - name: Download all TAR

        uses: actions/download-artifact@v4

        with:

          path: input



      - name: Install zstd

        run: |

          sudo apt update

          sudo apt install -y zstd



      - name: Merge Package

        shell: bash

        run: |

          mkdir package


          find input \
          -name "*.tar" \
          -exec cp {} package/ \;


          mkdir result


          echo "Docker Image Package" > result/result-amd64.txt

          echo "" >> result/result-amd64.txt


          echo "Images:" >> result/result-amd64.txt


          ls package/*.tar \
          >> result/result-amd64.txt



          tar \
          -cf docker-images-amd64.tar \
          -C package .



          zstd \
          -19 \
          docker-images-amd64.tar \
          -o docker-images-amd64.tar.zst



      - name: Upload Final Package

        uses: actions/upload-artifact@v4

        with:

          name: docker-images-amd64

          path: |

            docker-images-amd64.tar.zst

            result/result-amd64.txt
