name: Docker Pull Save amd64


on:

  workflow_dispatch:

    inputs:

      image:

        description: Docker Image

        required: true

        type: string


      tag:

        description: Image Tag

        required: false

        default: latest

        type: string



permissions:

  contents: write



concurrency:

  group: docker-amd64-${{ github.ref }}

  cancel-in-progress: true



jobs:


  build:


    name: Pull amd64 Image


    runs-on: ubuntu-22.04


    timeout-minutes: 45


    steps:


    - name: Free Disk

      run: |

        sudo rm -rf /usr/local/lib/android

        sudo rm -rf /usr/share/dotnet

        df -h



    - name: Install tools

      run: |

        sudo apt update

        sudo apt install -y zstd jq



    - name: Docker Login

      if: secrets.DOCKER_USERNAME != ''

      run: |

        echo "${{secrets.DOCKER_PASSWORD}}" |

        docker login \

        -u "${{secrets.DOCKER_USERNAME}}" \

        --password-stdin



    - name: Pull Image


      env:

        IMAGE: ${{inputs.image}}

        TAG: ${{inputs.tag}}


      run: |


        FULL=${IMAGE}:${TAG}


        for i in 1 2 3 4 5

        do

          docker pull --platform linux/amd64 $FULL && break

          echo retry $i

          sleep 20

        done



    - name: Save


      run: |


        mkdir output


        docker save \

        ${{inputs.image}}:${{inputs.tag}} \

        -o output/image.tar



    - name: Compress


      run: |


        cd output


        zstd -19 image.tar \

        -o docker-amd64.tar.zst


        sha256sum docker-amd64.tar.zst \

        > docker-amd64.sha256



    - name: Upload Artifact


      uses: actions/upload-artifact@v4


      with:


        name: docker-amd64

        path: output/docker-amd64.tar.zst

