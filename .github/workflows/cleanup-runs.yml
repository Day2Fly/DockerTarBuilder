name: Cleanup Failed Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete Failed Workflow Runs
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Cleanup failed workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u

          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/${REPO}/actions/runs"

          deleted=0
          failed=0
          page=1
          total_found=0

          echo "========================================"
          echo "开始扫描失败的 Workflow Runs"
          echo "仓库: ${REPO}"
          echo "========================================"

          while true; do

            echo
            echo "正在读取第 ${page} 页..."

            response=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "${API}?status=failure&per_page=100&page=${page}")

            count=$(echo "$response" | jq '.workflow_runs | length')

            if [ "$count" -eq 0 ]; then
              echo "没有更多失败记录。"
              break
            fi

            echo "本页找到 ${count} 个失败记录。"

            total_found=$((total_found + count))

            while IFS=$'\t' read -r run_id run_number name created_at; do

              echo
              echo "----------------------------------------"
              echo "Workflow : ${name}"
              echo "Run      : #${run_number}"
              echo "Run ID   : ${run_id}"
              echo "Created  : ${created_at}"
              echo "----------------------------------------"

              http_code=$(curl -sS \
                -o /tmp/delete_response.json \
                -w "%{http_code}" \
                -L \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "${API}/${run_id}")

              if [ "$http_code" = "204" ]; then
                echo "✅ 删除成功"
                deleted=$((deleted + 1))
              else
                echo "❌ 删除失败，HTTP ${http_code}"

                if [ -s /tmp/delete_response.json ]; then
                  cat /tmp/delete_response.json
                fi

                failed=$((failed + 1))
              fi

            done < <(
              echo "$response" |
              jq -r '
                .workflow_runs[] |
                [
                  .id,
                  .run_number,
                  .name,
                  .created_at
                ] |
                @tsv
              '
            )

            page=$((page + 1))

            # GitHub 对 status 筛选的搜索结果最多返回 1000 条。
            if [ "$page" -gt 10 ]; then
              echo
              echo "已达到 GitHub API 单次搜索最多 1000 条记录的限制。"
              break
            fi

          done

          echo
          echo "========================================"
          echo "清理完成"
          echo "========================================"
          echo "发现失败记录 : ${total_found}"
          echo "删除成功      : ${deleted}"
          echo "删除失败      : ${failed}"
          echo "========================================"

          rm -f /tmp/delete_response.json
